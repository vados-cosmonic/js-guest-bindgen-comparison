[package]
name = "runner"
version = "0.1.0"
edition = "2024"
[dependencies]
anyhow = "1"
wasmtime = { version = "=50.0.0", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "anyhow", "gc", "gc-drc"] }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
