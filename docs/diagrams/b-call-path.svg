<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1425" viewBox="0 0 1100 1425" role="img" aria-labelledby="title desc">
<title id="title">B · new componentize-js + native engine shims</title>
<desc id="desc">Export and nested import call paths. Colors identify code layers; the legend is inside the diagram. Boa drains module jobs at initialization. No async WIT calls or P2 I/O poll loop run here.</desc>
<style>svg { color-scheme: light dark; }
.canvas { fill: #ffffff; }
text { fill: #243746; font-family: Arial, sans-serif; }
.muted { fill: #526477; }
.arrow { stroke: #526477; fill: none; }
.arrowhead { fill: #526477; }
.layer-host { fill: #dceafb; stroke: #4776aa; }
.layer-bindings { fill: #fff0c2; stroke: #96700c; }
.layer-runtime { fill: #eadffa; stroke: #8253a7; }
.layer-adapter { fill: #d7efdf; stroke: #387b53; }
.layer-engine { fill: #fde1d7; stroke: #aa6243; }
.layer-glue { fill: #d7f0f0; stroke: #347d83; }
.layer-note { fill: #eef1f5; stroke: #7b8797; }
@media (prefers-color-scheme: dark) {
.canvas { fill: #101821; }
text { fill: #eef3f8; }
.muted { fill: #b8c5d4; }
.arrow { stroke: #b8c5d4; }
.arrowhead { fill: #b8c5d4; }
.layer-host { fill: #203c59; stroke: #85b5e8; }
.layer-bindings { fill: #4b3a13; stroke: #e8c76b; }
.layer-runtime { fill: #3f2c53; stroke: #c1a0e5; }
.layer-adapter { fill: #203f30; stroke: #8bcda6; }
.layer-engine { fill: #4c3027; stroke: #edaa8d; }
.layer-glue { fill: #1d4045; stroke: #84cbd0; }
.layer-note { fill: #283343; stroke: #99a8ba; }
[style*="fill: #ffffff"] { fill: #101821 !important; }
[style*="stroke: #ffffff"] { stroke: #101821 !important; }
[style*="fill: #243746"] { fill: #eef3f8 !important; }
[style*="stroke: #243746"] { stroke: #eef3f8 !important; }
[style*="fill: #526477"] { fill: #b8c5d4 !important; }
[style*="stroke: #526477"] { stroke: #b8c5d4 !important; }
[style*="fill: #d7dee7"] { fill: #344456 !important; }
[style*="stroke: #d7dee7"] { stroke: #344456 !important; }
[style*="fill: #dceafb"] { fill: #203c59 !important; }
[style*="stroke: #dceafb"] { stroke: #203c59 !important; }
[style*="fill: #4776aa"] { fill: #85b5e8 !important; }
[style*="stroke: #4776aa"] { stroke: #85b5e8 !important; }
[style*="fill: #fff0c2"] { fill: #4b3a13 !important; }
[style*="stroke: #fff0c2"] { stroke: #4b3a13 !important; }
[style*="fill: #96700c"] { fill: #e8c76b !important; }
[style*="stroke: #96700c"] { stroke: #e8c76b !important; }
[style*="fill: #eadffa"] { fill: #3f2c53 !important; }
[style*="stroke: #eadffa"] { stroke: #3f2c53 !important; }
[style*="fill: #8253a7"] { fill: #c1a0e5 !important; }
[style*="stroke: #8253a7"] { stroke: #c1a0e5 !important; }
[style*="fill: #d7efdf"] { fill: #203f30 !important; }
[style*="stroke: #d7efdf"] { stroke: #203f30 !important; }
[style*="fill: #387b53"] { fill: #8bcda6 !important; }
[style*="stroke: #387b53"] { stroke: #8bcda6 !important; }
[style*="fill: #fde1d7"] { fill: #4c3027 !important; }
[style*="stroke: #fde1d7"] { stroke: #4c3027 !important; }
[style*="fill: #aa6243"] { fill: #edaa8d !important; }
[style*="stroke: #aa6243"] { stroke: #edaa8d !important; }
[style*="fill: #d7f0f0"] { fill: #1d4045 !important; }
[style*="stroke: #d7f0f0"] { stroke: #1d4045 !important; }
[style*="fill: #347d83"] { fill: #84cbd0 !important; }
[style*="stroke: #347d83"] { stroke: #84cbd0 !important; }
[style*="fill: #eef1f5"] { fill: #283343 !important; }
[style*="stroke: #eef1f5"] { stroke: #283343 !important; }
