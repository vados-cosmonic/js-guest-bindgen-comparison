<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" class="arrowhead"/></marker></defs>
<rect class="canvas" width="1100" height="1425"/>
<rect x="45" y="12" width="1010" height="55" rx="9" class="layer-note" stroke-width="2"/>
<text x="550.0" y="41" text-anchor="middle" font-size="26" font-weight="bold">B · new componentize-js + native engine shims</text>
<rect x="65" y="90" width="970" height="79" rx="9" class="layer-host" stroke-width="2"/>
<text x="550.0" y="119" text-anchor="middle" font-size="18" font-weight="bold">1. Host calls a component export</text>
<text x="550.0" y="143" text-anchor="middle" font-size="15" font-weight="normal">Wasmtime lowers host values to the guest Canonical ABI</text>
<rect x="65" y="199" width="970" height="79" rx="9" class="layer-runtime" stroke-width="2"/>
<text x="550.0" y="228" text-anchor="middle" font-size="18" font-weight="bold">2. Generated native ABI runtime receives the core call</text>
<text x="550.0" y="252" text-anchor="middle" font-size="15" font-weight="normal">wit-bindgen-c output · lifts canonical memory / flat values into typed C values</text>
<path d="M550,169 L550,194" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="308" width="970" height="79" rx="9" class="layer-adapter" stroke-width="2"/>
<text x="550.0" y="337" text-anchor="middle" font-size="18" font-weight="bold">3. Interface-specific native engine shim boxes arguments</text>
<text x="550.0" y="361" text-anchor="middle" font-size="15" font-weight="normal">native/common/shims_b.c · uses Boa / Porffor APIs; no canonical memory layout work</text>
<path d="M550,278 L550,303" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="417" width="970" height="79" rx="9" class="layer-engine" stroke-width="2"/>
<text x="550.0" y="446" text-anchor="middle" font-size="18" font-weight="bold">4. Application JavaScript runs</text>
<text x="550.0" y="470" text-anchor="middle" font-size="15" font-weight="normal">Boa interprets JS bytecode · Porffor executes AOT-compiled Wasm</text>
<path d="M550,387 L550,412" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="526" width="970" height="79" rx="9" class="layer-adapter" stroke-width="2"/>
<text x="550.0" y="555" text-anchor="middle" font-size="18" font-weight="bold">5. Native engine shim unboxes the application result</text>
<text x="550.0" y="579" text-anchor="middle" font-size="15" font-weight="normal">Extracts typed native values through engine APIs · releases temporary JS roots</text>
<path d="M550,496 L550,521" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="635" width="970" height="79" rx="9" class="layer-runtime" stroke-width="2"/>
<text x="550.0" y="664" text-anchor="middle" font-size="18" font-weight="bold">6. Generated native ABI runtime lowers the result</text>
<text x="550.0" y="688" text-anchor="middle" font-size="15" font-weight="normal">wit-bindgen-c output · writes canonical offsets, flat values and return areas</text>
<path d="M550,605 L550,630" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="744" width="970" height="79" rx="9" class="layer-host" stroke-width="2"/>
<text x="550.0" y="773" text-anchor="middle" font-size="18" font-weight="bold">7. Host lifts the result and invokes canonical post-return</text>
<text x="550.0" y="797" text-anchor="middle" font-size="15" font-weight="normal">Wasmtime owns this phase; the generated native runtime frees returned strings / lists</text>
<path d="M550,714 L550,739" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="870" width="970" height="54" rx="9" class="layer-note" stroke-width="2"/>
<text x="550.0" y="899" text-anchor="middle" font-size="18" font-weight="bold">Nested host import · called from the application in step 4</text>
<rect x="65.0" y="940" width="220.0" height="78" rx="9" class="layer-glue" stroke-width="2"/>
<text x="175.0" y="969" text-anchor="middle" font-size="17" font-weight="bold">componentize-js JS</text>
<text x="175.0" y="993" text-anchor="middle" font-size="15" font-weight="normal">Generated import module</text>
<rect x="315.0" y="940" width="220.0" height="78" rx="9" class="layer-adapter" stroke-width="2"/>
<text x="425.0" y="969" text-anchor="middle" font-size="17" font-weight="bold">Native typed shim</text>
<text x="425.0" y="993" text-anchor="middle" font-size="15" font-weight="normal">Engine value conversion</text>
<path d="M285.0,979 L310.0,979" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565.0" y="940" width="220.0" height="78" rx="9" class="layer-runtime" stroke-width="2"/>
<text x="675.0" y="969" text-anchor="middle" font-size="17" font-weight="bold">Native ABI runtime</text>
<text x="675.0" y="993" text-anchor="middle" font-size="15" font-weight="normal">wit-bindgen-c lowering</text>
<path d="M535.0,979 L560.0,979" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="815.0" y="940" width="220.0" height="78" rx="9" class="layer-host" stroke-width="2"/>
<text x="925.0" y="969" text-anchor="middle" font-size="17" font-weight="bold">Host function</text>
<text x="925.0" y="993" text-anchor="middle" font-size="15" font-weight="normal">Produces the result</text>
<path d="M785.0,979 L810.0,979" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="1034" width="970" height="79" rx="9" class="layer-note" stroke-width="2"/>
<text x="550.0" y="1063" text-anchor="middle" font-size="18" font-weight="bold">The host result returns to the active application call</text>
<text x="550.0" y="1087" text-anchor="middle" font-size="15" font-weight="normal">Result returns through the native ABI runtime and shim to the generated JS import wrapper.</text>
<rect x="65" y="1134" width="970" height="79" rx="9" class="layer-note" stroke-width="2"/>
<text x="550.0" y="1163" text-anchor="middle" font-size="18" font-weight="bold">Jobs and asynchronous execution</text>
<text x="550.0" y="1187" text-anchor="middle" font-size="15" font-weight="normal">Boa drains module jobs at initialization. No async WIT calls or P2 I/O poll loop run here.</text>
<text x="65" y="1253" font-size="18" font-weight="bold">Color legend · code layer owning each step</text>
<rect x="65" y="1270" width="470" height="35" rx="9" class="layer-host" stroke-width="2"/>
<text x="300.0" y="1293" text-anchor="middle" font-size="15" font-weight="bold">Wasmtime / host boundary</text>
<rect x="565" y="1270" width="470" height="35" rx="9" class="layer-glue" stroke-width="2"/>
<text x="800.0" y="1293" text-anchor="middle" font-size="15" font-weight="bold">New componentize-js generated JS</text>
<rect x="65" y="1313" width="470" height="35" rx="9" class="layer-runtime" stroke-width="2"/>
<text x="300.0" y="1336" text-anchor="middle" font-size="15" font-weight="bold">Native ABI runtime · wit-bindgen-c</text>
<rect x="565" y="1313" width="470" height="35" rx="9" class="layer-adapter" stroke-width="2"/>
<text x="800.0" y="1336" text-anchor="middle" font-size="15" font-weight="bold">Native engine shims · this repo</text>
<rect x="65" y="1356" width="470" height="35" rx="9" class="layer-engine" stroke-width="2"/>
<text x="300.0" y="1379" text-anchor="middle" font-size="15" font-weight="bold">Application running in Boa / Porffor</text>
<rect x="565" y="1356" width="470" height="35" rx="9" class="layer-note" stroke-width="2"/>
<text x="800.0" y="1379" text-anchor="middle" font-size="15" font-weight="bold">Execution notes / cross-layer explanation</text>
</svg>
